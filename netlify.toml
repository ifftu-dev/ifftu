[build]
  command = "npm run build"
  publish = "dist"

# The Alexandria announcement moved to the Alexandria site. Anything already
# linking to the old URL — search results, other sites, previously shared links
# — would otherwise hit a 404, so send it on rather than dropping it. 301 so
# search engines transfer the ranking to the new home.
[[redirects]]
  from = "/blog/introducing-alexandria/"
  to = "https://alexandria.ifftu.dev/blog/introducing-alexandria"
  status = 301
  force = true

# Astro is configured trailingSlash: 'always', but inbound links from elsewhere
# will not all have one.
[[redirects]]
  from = "/blog/introducing-alexandria"
  to = "https://alexandria.ifftu.dev/blog/introducing-alexandria"
  status = 301
  force = true

[build.environment]
  NODE_VERSION = "22"

# Hashed assets (CSS, JS, fonts from _astro/) — immutable, cache forever
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static fonts — cache for 1 year
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages. A small non-zero max-age is what actually kills the
# pre-navigation pause: with max-age=0 the browser (and Astro's router fetch)
# revalidates the prefetched page on every click — a blocking ~0.5-1s round-trip.
# Firefox/Safari don't honor stale-while-revalidate, so max-age=0 hurt them
# regardless. max-age=300 lets the prefetched copy be served straight from cache
# with no network, so navigation is instant; swr covers the grace window for
# browsers that support it. Netlify's durable edge cache is auto-purged on every
# deploy, and the 5-min browser window bounds any post-deploy staleness.
# (More-specific /_astro/* and /fonts/* rules above keep their immutable cache.)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, durable"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
